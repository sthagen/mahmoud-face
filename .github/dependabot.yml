version: 2

updates:
  # Actions are hash-pinned with a trailing `# vX.Y.Z` comment; Dependabot
  # updates both the hash and the comment.
  #
  # Two groups, split by risk: minor/patch bumps are routine and can be
  # merged on green CI, majors need a real look. Splitting them keeps a
  # trivial patch from being held hostage by a breaking change in the same
  # branch.
  #
  # Both groups are needed. A dependency matching a group's `patterns` is
  # marked handled by that group even when `update-types` filters it out, and
  # a handled dependency never falls through to an individual PR -- so a lone
  # minor/patch group with `patterns: ["*"]` silently drops every major
  # update. The second group exists to catch them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci

# Deliberately not covered:
#   - uv / pip: `boltons>=20.0.0` is a floor, not a pin, and nothing in CI
#     installs from `uv.lock` (tox-uv resolves `dependency_groups = dev`
#     fresh), so lockfile bumps would be PR noise with no effect on CI or on
#     what users get.
#   - docs/requirements-rtd.txt: unpinned, nothing to bump.
#   - examples/*/requirements.txt: illustrative floors, not a build input.
