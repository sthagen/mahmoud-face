version: 2

updates:
  # Actions are hash-pinned with a trailing `# vX.Y.Z` comment; Dependabot
  # updates both the hash and the comment. One group, so a round of bumps is
  # a single PR instead of seven.
  #
  # Do NOT add `update-types` here to split majors into their own PR. Group
  # claiming happens on `patterns` alone and `update-types` filters *after*
  # the claim, so a `patterns: ["*"]` group marks every action handled and
  # the filtered-out majors are dropped entirely -- they do not fall through
  # to individual PRs, and a second wildcard group only logs "already handled
  # by a previous group". Verified against the update-job logs, 2026-08-01.
  # To defer one risky bump, comment `@dependabot ignore <dep> <version>` on
  # the PR; the group rebuilds without it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

# Deliberately not covered:
#   - uv / pip: `boltons>=20.0.0` is a floor, not a pin, and nothing in CI
#     installs from `uv.lock` (tox-uv resolves `dependency_groups = dev`
#     fresh), so lockfile bumps would be PR noise with no effect on CI or on
#     what users get.
#   - docs/requirements-rtd.txt: unpinned, nothing to bump.
#   - examples/*/requirements.txt: illustrative floors, not a build input.
