version: 2

updates:
  # Actions are hash-pinned with a trailing `# vX.Y.Z` comment; Dependabot
  # updates both the hash and the comment.
  #
  # Minor and patch bumps are grouped into one low-risk PR that can be merged
  # on green CI. Majors are deliberately left out of the group so each one
  # gets its own PR and its own review -- otherwise a routine patch is held
  # hostage by a breaking change sitting in the same branch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Majors are ungrouped, so each one costs a PR slot. The default limit of
    # 5 would silently suppress some once a couple of stale PRs pile up,
    # which would defeat the point of splitting them out. 7 actions tracked.
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci

# Deliberately not covered:
#   - uv / pip: `boltons>=20.0.0` is a floor, not a pin, and nothing in CI
#     installs from `uv.lock` (tox-uv resolves `dependency_groups = dev`
#     fresh), so lockfile bumps would be PR noise with no effect on CI or on
#     what users get.
#   - docs/requirements-rtd.txt: unpinned, nothing to bump.
#   - examples/*/requirements.txt: illustrative floors, not a build input.
